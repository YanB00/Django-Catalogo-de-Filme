{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Filmes</title>
    <link rel="stylesheet" href="{% static 'filmes/style.css' %}" />
</head>
<body>
    <header>
        <h1>{{ form.instance.pk|yesno:"Editar Filme, Novo Filme"}}</h1>
        <div class="actions">
            <a href="{%url 'lista_filmes' %}" class="btn-novo">Voltar para a Lista</a>
        </div>
    </header>

    <div class="form-container">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token%}
            {{ form.as_p}}
            <div class="form-actions">
                <a href="{%url 'lista_filmes' %}" class="btn-cancelar">Cancelar</a> {# Link para o botão Cancelar #}
                <button type="submit" class="btn-salvar">Salvar</button>
            </div>
        </form>
    </div>
</body>
</html>
