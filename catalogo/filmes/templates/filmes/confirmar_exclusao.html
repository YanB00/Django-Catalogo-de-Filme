{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Exclusão</title>
    <link rel="stylesheet" href="{% static 'filmes/style.css' %}" />
</head>
<body>
    <header>
        <h1>Confirmar Exclusão</h1>
        <div class="actions">
            <a href="{%url 'lista_filmes' %}" class="btn-novo">Voltar para a Lista</a>
        </div>
    </header>

    <div class="form-container"> 
        <h1>Tem certeza que deseja excluir "{{filme.titulo}}"?</h1> 
        <form method="post">
            {% csrf_token%}
            <div class="form-actions"> 
                <a href="{%url 'lista_filmes' %}" class="btn-cancelar">Cancelar</a>
                <button type="submit" class="btn-deletar">Confirmar Exclusão</button> 
            </div>
        </form>
    </div>
</body>
</html>
